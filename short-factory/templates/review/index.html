<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review before rendering</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #16181d; --muted: #5d6370; --line: #e1e4ea;
  --accent: #0a84c6; --accent-ink: #ffffff; --warn-bg: #fff6e0; --warn-line: #f0c24b;
  --open: #d9480f; --done: #2b8a3e; --pin: #ff3b5c;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111317; --panel: #1a1d23; --ink: #eef0f4; --muted: #a2a8b4; --line: #2c313a;
    --accent: #3fb3f0; --accent-ink: #06121a; --warn-bg: #2b2412; --warn-line: #8a6d1d; --open: #ff8a5c; --done: #69db7c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, sans-serif; }
button { font: inherit; cursor: pointer; }
.page { display: grid; grid-template-columns: auto minmax(320px, 440px); gap: 24px; padding: 20px; min-height: 100vh; align-items: start; }
@media (max-width: 900px) { .page { grid-template-columns: 1fr; padding: 16px; } }
.stage { display: grid; gap: 10px; justify-items: center; }
.frame { position: relative; height: min(82vh, 900px); aspect-ratio: 9 / 16; background: #000; border-radius: 10px; overflow: hidden; }
@media (max-width: 900px) { .frame { height: auto; width: 100%; max-width: 420px; } }
.catcher { position: absolute; inset: 0; cursor: crosshair; background: rgba(0, 0, 0, 0.18); z-index: 5; }
.hint { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.78); color: #fff;
  padding: 8px 14px; border-radius: 999px; font-weight: 600; white-space: nowrap; pointer-events: none; }
.hint span { font-weight: 400; opacity: 0.75; margin-left: 10px; font-size: 0.85em; }
.pin { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 3px solid #fff;
  background: var(--pin); color: #fff; font-weight: 700; display: grid; place-items: center; z-index: 4;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45); padding: 0; font-size: 14px; }
.pin.done { background: #2b8a3e; }
.pin.draft { background: var(--accent); pointer-events: none; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
.now { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 8.5em; }
.now small { color: var(--muted); font-weight: 400; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 600; }
.primary:disabled { opacity: 0.45; cursor: default; }
.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
kbd { font: 12px/1 ui-monospace, monospace; border: 1px solid currentColor; border-radius: 4px; padding: 2px 5px; margin-left: 6px; opacity: 0.8; }
.keys { color: var(--muted); font-size: 0.85rem; margin: 0; }
.side { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 16px; }
.eyebrow { margin: 0; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
h1 { margin: 2px 0 0; font-size: 1.35rem; }
.label { margin: 4px 0 0; color: var(--accent); font-weight: 600; }
h2 { font-size: 1rem; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
.count { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
.block ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 12px; }
.error { background: #ffe3e3; color: #a51111; border-radius: 8px; padding: 8px 10px; margin: 0; }
.draft-box { border: 2px solid var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.draft-head { margin: 0; }
textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; }
.row { display: flex; gap: 8px; }
.empty { color: var(--muted); margin: 0; }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.notes li { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; }
.notes li.done { opacity: 0.75; }
.note-top { display: flex; gap: 8px; align-items: center; }
.badge { width: 24px; height: 24px; border-radius: 50%; background: var(--pin); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 13px; }
li.done .badge { background: #2b8a3e; }
.time { background: none; border: 0; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; padding: 0; text-decoration: underline; }
.status { font-size: 0.8rem; font-weight: 600; }
.status.open { color: var(--open); } .status.done { color: var(--done); }
.link { margin-left: auto; background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 0; font-size: 0.85rem; }
.text { margin: 0; white-space: pre-wrap; }
.reply { margin: 0; padding: 8px 10px; background: var(--bg); border-radius: 8px; white-space: pre-wrap; }
.approve { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 14px; }
.approve-btn { background: var(--done); color: #fff; border: 0; border-radius: 10px; padding: 12px; font-weight: 700; font-size: 1rem; }
.confirm { display: grid; gap: 8px; border: 2px solid var(--done); border-radius: 10px; padding: 12px; }
.confirm p { margin: 0; font-weight: 600; }
.confirm .row .approve-btn { flex: 1; }
.link-row { margin-left: auto; display: flex; gap: 10px; }
.link-row .link { margin-left: 0; }
.link.danger { color: var(--open); font-weight: 600; }
.ok { margin: 0; color: var(--done); font-weight: 700; }
.small { margin: 0; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/review.js"></script>
</body>
</html>
